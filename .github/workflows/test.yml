  name: CI

  on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:18
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: CivicConnect
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U postgres"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        - uses: actions/checkout@v4

        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '10.0.x'

        - name: Restore dependencies
          run: dotnet restore src/CivicConnect.slnx

        - name: Build solution
          run: dotnet build src/CivicConnect.slnx --no-restore --configuration Release

        - name: Run tests
          run: dotnet test src/CivicConnect.slnx --no-build --configuration Release --verbosity normal
