name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=civicconnect_ci;Username=civicconnect_ci;Password=ci-only-password

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: civicconnect_ci
          POSTGRES_USER: civicconnect_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicconnect_ci -d civicconnect_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/CivicConnect.slnx

      - name: Build solution
        run: dotnet build src/CivicConnect.slnx --configuration Release --no-restore

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Apply database migrations
        run: dotnet ef database update --project src/CivicConnect.Web --startup-project src/CivicConnect.Web --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format src/CivicConnect.slnx --verify-no-changes --no-restore

      - name: Check vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          python3 scripts/check-vulnerabilities.py --self-test
          dotnet list src/CivicConnect.slnx package --vulnerable --include-transitive --format json --output-version 1 > TestResults/vulnerabilities.json
          python3 scripts/check-vulnerabilities.py TestResults/vulnerabilities.json

      - name: Test solution
        run: >-
          dotnet test src/CivicConnect.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: error
