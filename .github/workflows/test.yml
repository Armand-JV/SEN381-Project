  name: CI

  on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '10.0.x'

        - name: Restore dependencies
          run: dotnet restore src/CivicConnect.slnx

        - name: Build solution
          run: dotnet build src/CivicConnect.slnx --no-restore --configuration Release

        - name: Run tests
          run: dotnet test src/CivicConnect.Tests/CivicConnect.Tests.csproj --configuration Release --verbosity normal
