name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=civicconnect_ci;Username=civicconnect_ci;Password=ci-only-password

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: civicconnect_ci
          POSTGRES_USER: civicconnect_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicconnect_ci -d civicconnect_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CivicConnect.Web/ClientApp/package-lock.json

      - name: Build frontend
        working-directory: src/CivicConnect.Web/ClientApp
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/CivicConnect.slnx

      - name: Build solution
        run: dotnet build src/CivicConnect.slnx --configuration Release --no-restore

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Add dotnet global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Apply database migrations
        run: |
          set -euo pipefail
          echo "Waiting for PostgreSQL to become available..."
          for i in {1..15}; do
            if pg_isready -h localhost -p 5432 -U civicconnect_ci -d civicconnect_ci >/dev/null 2>&1; then
              echo "Postgres ready"
              break
            fi
            echo "Postgres not ready yet (attempt $i/15). Sleeping 2s..."
            sleep 2
          done

          echo "Listing available migrations:"
          dotnet ef migrations list --project src/CivicConnect.Web --startup-project src/CivicConnect.Web --configuration Release --no-build

          echo "Applying database migrations:"
          dotnet ef database update --project src/CivicConnect.Web --startup-project src/CivicConnect.Web --configuration Release --no-build

          echo "Verifying Requests table exists after migration:"
          psql "host=localhost port=5432 dbname=civicconnect_ci user=civicconnect_ci password=ci-only-password" -c "SELECT 1 FROM \"Requests\" LIMIT 1;" || (echo "Requests table missing after migration" && exit 1)

      - name: Verify formatting
        run: dotnet format src/CivicConnect.slnx --verify-no-changes --no-restore

      - name: Check vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          python3 scripts/check-vulnerabilities.py --self-test
          dotnet list src/CivicConnect.slnx package --vulnerable --include-transitive --format json --output-version 1 > TestResults/vulnerabilities.json
          python3 scripts/check-vulnerabilities.py TestResults/vulnerabilities.json

      - name: Test solution
        run: >-
          dotnet test src/CivicConnect.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: error
